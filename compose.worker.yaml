# Preparação apenas: executar num servidor dedicado, nunca numa função Vercel.
# docker compose --env-file .env.worker -f compose.worker.yaml up -d --build
services:
  worker:
    build: .
    command: python worker.py --concurrency 4
    env_file: .env.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL PostgreSQL da mesma instalação da API}
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
